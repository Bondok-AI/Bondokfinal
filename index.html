
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="تطبيق قصص أطفال تفاعلي بالذكاء الاصطناعي - حكاياتي الذكية" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    
    <title>حكاياتي الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      /* Light Mode (default) */
      :root {
        --bg-primary: #fef9c3;
        --bg-secondary: #fff7ed;
        --bg-tertiary: #ecfeff;
        --text-primary: #1e293b;
        --text-secondary: #475569;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
      }
      
      /* Dark Mode */
      .dark {
        --bg-primary: #1e1b4b;
        --bg-secondary: #312e81;
        --bg-tertiary: #1e3a5f;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --card-bg: #1e293b;
        --card-border: #334155;
      }
      
      body {
        font-family: 'Cairo', 'Almarai', sans-serif;
        background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
        background-attachment: fixed;
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.3s ease, color 0.3s ease;
      }
      
      .dark body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
      }
      
      /* Fluid Typography */
      h1 { font-size: clamp(1.75rem, 5vw, 3.5rem); }
      h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); }
      p { font-size: clamp(1rem, 2.5vw, 1.25rem); }
      
      /* Magical Background Pattern */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
        opacity: 0.03;
        pointer-events: none;
        z-index: -1;
      }
      
      .dark body::before {
        opacity: 0.05;
      }

      .magic-shadow {
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
      }
      
      .toy-button {
        box-shadow: 0 8px 0px #d97706;
        transition: all 0.1s ease;
      }
      .toy-button:active {
        box-shadow: 0 2px 0px #d97706;
        transform: translateY(6px);
      }

      @keyframes sparkle {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
        50% { transform: scale(1.2) rotate(15deg); opacity: 0.8; }
      }
      .animate-sparkle {
        animation: sparkle 2s ease-in-out infinite;
      }

      .page-transition-enter {
        animation: slideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }
      @keyframes slideIn {
        0% { transform: translateX(50px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      /* Custom Scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      /* Safe Area Insets for notch/home indicator */
      .safe-top {
        padding-top: max(1.5rem, env(safe-area-inset-top));
      }
      .safe-bottom {
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
      .safe-left {
        padding-left: max(1rem, env(safe-area-inset-left));
      }
      .safe-right {
        padding-right: max(1rem, env(safe-area-inset-right));
      }
      .safe-all {
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }
      /* Fixed positioning with safe areas */
      .fixed-safe-top {
        top: max(1.5rem, env(safe-area-inset-top));
      }
      .fixed-safe-bottom {
        bottom: max(1.5rem, env(safe-area-inset-bottom));
      }
      .fixed-safe-left {
        left: max(1.5rem, env(safe-area-inset-left));
      }
      .fixed-safe-right {
        right: max(1.5rem, env(safe-area-inset-right));
      }

      /* Floating button animation */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      /* Pop-in animation */
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* Shake animation for errors */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-5px); }
        40%, 80% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.4s ease-in-out;
      }

      /* Smooth page transitions */
      @keyframes fadeSlideIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-slide-in {
        animation: fadeSlideIn 0.3s ease-out;
      }

      /* Fade in animation */
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* Bounce in animation for celebration */
      @keyframes bounceIn {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.05); }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-bounce-in {
        animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      /* Shimmer effect for progress bar */
      @keyframes shimmer {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-shimmer {
        animation: shimmer 2s infinite;
      }

      /* Page flip animation */
      @keyframes pageFlip {
        0% { transform: rotateY(0deg) scale(1); opacity: 1; }
        50% { transform: rotateY(-5deg) scale(0.95); opacity: 0.8; }
        100% { transform: rotateY(0deg) scale(1); opacity: 1; }
      }
      .animate-page-flip {
        animation: pageFlip 0.4s ease-out;
      }

      /* Better touch targets for mobile */
      @media (max-width: 640px) {
        button, a, [role="button"] {
          min-height: 44px;
          min-width: 44px;
        }
      }

      /* Reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Touch action for better mobile interactions */
      .touch-pan-y {
        touch-action: pan-y;
      }
      .touch-none {
        touch-action: none;
      }
      
      /* Better focus visibility */
      :focus-visible {
        outline: 2px solid #6366f1;
        outline-offset: 2px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, show update prompt
                  if (confirm('تحديث جديد متاح! هل تريد التحديث الآن؟')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
