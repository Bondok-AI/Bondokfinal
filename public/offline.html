<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>غير متصل - حكاياتي الذكية</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cairo', 'Almarai', -apple-system, sans-serif;
      background: linear-gradient(135deg, #fef9c3 0%, #fff7ed 50%, #ecfeff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      background: white;
      border-radius: 3rem;
      padding: 3rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 {
      color: #4f46e5;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 1rem;
    }
    p {
      color: #64748b;
      font-size: 1.2rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 2rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 0 #3730a3;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #3730a3;
    }
    .hint {
      margin-top: 2rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>عفواً، لا يوجد اتصال!</h1>
    <p>
      يبدو أن بندوق لا يستطيع الوصول للإنترنت الآن. 
      <br>
      لكن لا تقلق، يمكنك قراءة قصصك المحفوظة!
    </p>
    <button onclick="window.location.reload()">
      🔄 حاول مرة أخرى
    </button>
    <p class="hint">
      💡 القصص التي قرأتها سابقاً محفوظة ويمكنك الوصول إليها
    </p>
  </div>
</body>
</html>
